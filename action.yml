name: Jest Security Extension Guard
description: Scan the VS Code extensions your repository recommends (extensions.json, dev containers, workspaces) and block risky or known-malicious ones in pull requests.
author: Jest-Test-Team
branding:
  icon: shield
  color: blue

inputs:
  version:
    description: '@jest-test-team/security-cli version to run with npx, or "source" to build it from the action checkout'
    default: '0.2.0'
  manifests:
    description: 'Extension list files or folders, separated by spaces or new lines (default: auto-discover .vscode/extensions.json, devcontainer.json, *.code-workspace)'
    default: ''
  base:
    description: 'Revision to compare with (default: the pull request base, or the previous commit on push). "none" scans every listed extension.'
    default: ''
  scan-all:
    description: 'Also scan extensions that did not change (with a base)'
    default: 'false'
  fail-on:
    description: 'high, medium or none (default: the policy file, else high)'
    default: ''
  policy:
    description: 'Policy file (default .github/jest-security.yml when it exists)'
    default: ''
  registry:
    description: 'marketplace or open-vsx'
    default: marketplace
  registry-url:
    description: 'Base URL of a private Marketplace / Open VSX mirror'
    default: ''
  target-platform:
    description: 'Build to scan for platform-specific extensions'
    default: linux-x64
  deep:
    description: 'Also run the Rust / Go / Python / Julia analyzers when installed on the runner'
    default: 'false'
  comment:
    description: 'Post / update one summary comment on the pull request'
    default: 'true'
  sarif:
    description: 'Upload SARIF to code scanning (needs security-events write; private repositories need GitHub Advanced Security)'
    default: 'true'
  sarif-category:
    description: 'Code scanning category'
    default: jest-security-extensions
  fail-on-incomplete:
    description: 'Fail when some extensions could not be downloaded or scanned (registry outage, hash mismatch)'
    default: 'true'
  node-version:
    description: 'Node.js version to use'
    default: '22'
  github-token:
    description: 'Token for the pull request comment'
    default: ${{ github.token }}

outputs:
  exit-code:
    description: '0 pass, 1 blocked, 2 incomplete'
    value: ${{ steps.scan.outputs.exit-code }}
  scanned:
    description: 'Number of extensions scanned'
    value: ${{ steps.scan.outputs.scanned }}
  high:
    description: 'Extensions at high risk or violating the policy'
    value: ${{ steps.scan.outputs.high }}
  medium:
    description: 'Extensions at medium risk'
    value: ${{ steps.scan.outputs.medium }}
  sarif-file:
    description: 'Path of the SARIF report'
    value: ${{ steps.scan.outputs.sarif-file }}
  summary-file:
    description: 'Path of the Markdown summary'
    value: ${{ steps.scan.outputs.summary-file }}

runs:
  using: composite
  steps:
    - uses: actions/setup-node@v4
      with:
        node-version: ${{ inputs.node-version }}

    - name: Cache downloaded extensions
      uses: actions/cache@v4
      with:
        path: ${{ runner.temp }}/jest-security-vsix
        key: jest-security-vsix-${{ runner.os }}-${{ hashFiles('**/.vscode/extensions.json', '**/devcontainer.json', '**/.devcontainer.json', '**/*.code-workspace') }}
        restore-keys: jest-security-vsix-${{ runner.os }}-

    - name: Prepare jest-security
      id: cli
      shell: bash
      env:
        VERSION: ${{ inputs.version }}
        ACTION_PATH: ${{ github.action_path }}
      run: |
        set -euo pipefail
        if [ "$VERSION" = "source" ]; then
          (cd "$ACTION_PATH" && npm ci --ignore-scripts --no-audit --no-fund && npm run build -w @jest-test-team/security-cli)
          echo "cmd=node $ACTION_PATH/packages/cli/dist/jest-security.js" >> "$GITHUB_OUTPUT"
        else
          if ! [[ "$VERSION" =~ ^[0-9A-Za-z.+-]+$ ]]; then echo "::error::invalid version input"; exit 2; fi
          echo "cmd=npx --yes --package=@jest-test-team/security-cli@$VERSION jest-security" >> "$GITHUB_OUTPUT"
        fi

    - name: Find the base revision
      id: base
      shell: bash
      env:
        INPUT_BASE: ${{ inputs.base }}
        EVENT: ${{ github.event_name }}
        PR_BASE: ${{ github.event.pull_request.base.sha }}
        MG_BASE: ${{ github.event.merge_group.base_sha }}
        PUSH_BEFORE: ${{ github.event.before }}
      run: |
        set -euo pipefail
        base="$INPUT_BASE"
        if [ -z "$base" ]; then
          case "$EVENT" in
            pull_request|pull_request_target) base="$PR_BASE" ;;
            merge_group) base="$MG_BASE" ;;
            push) [[ "$PUSH_BEFORE" =~ ^0+$ ]] || base="$PUSH_BEFORE" ;;
          esac
        fi
        [ "$base" = "none" ] && base=""
        if [ -n "$base" ] && ! git cat-file -e "$base^{commit}" 2>/dev/null; then
          # Only the base's manifest files are read, so one commit is enough even in a shallow clone.
          git fetch --no-tags --depth=1 origin "$base" || echo "::warning::could not fetch base $base; scanning every listed extension"
          git cat-file -e "$base^{commit}" 2>/dev/null || base=""
        fi
        echo "ref=$base" >> "$GITHUB_OUTPUT"

    - name: Scan extension lists
      id: scan
      shell: bash
      env:
        CLI: ${{ steps.cli.outputs.cmd }}
        BASE: ${{ steps.base.outputs.ref }}
        MANIFESTS: ${{ inputs.manifests }}
        SCAN_ALL: ${{ inputs.scan-all }}
        FAIL_ON: ${{ inputs.fail-on }}
        POLICY: ${{ inputs.policy }}
        REGISTRY: ${{ inputs.registry }}
        REGISTRY_URL: ${{ inputs.registry-url }}
        TARGET: ${{ inputs.target-platform }}
        DEEP: ${{ inputs.deep }}
      run: |
        set -uo pipefail
        sarif="$RUNNER_TEMP/jest-security-extensions.sarif"
        summary="$RUNNER_TEMP/jest-security-summary.md"
        : > "$summary"
        args=(scan-manifest --format sarif --out "$sarif" --summary "$summary" --annotations --registry "$REGISTRY" --target-platform "$TARGET" --cache-dir "$RUNNER_TEMP/jest-security-vsix")
        [ -n "$BASE" ] && args+=(--base "$BASE")
        [ "$SCAN_ALL" = "true" ] && args+=(--all)
        [ -n "$FAIL_ON" ] && args+=(--fail-on "$FAIL_ON")
        [ -n "$POLICY" ] && args+=(--policy "$POLICY")
        [ -n "$REGISTRY_URL" ] && args+=(--registry-url "$REGISTRY_URL")
        [ "$DEEP" = "true" ] && args+=(--deep)
        read -r -d '' -a files <<< "$MANIFESTS" || true
        args+=("${files[@]}")
        $CLI "${args[@]}"
        code=$?
        echo "exit-code=$code" >> "$GITHUB_OUTPUT"
        echo "sarif-file=$sarif" >> "$GITHUB_OUTPUT"
        echo "summary-file=$summary" >> "$GITHUB_OUTPUT"
        if [ -s "$sarif" ]; then
          node -e '
            const r = JSON.parse(require("fs").readFileSync(process.argv[1], "utf8")).runs[0].results;
            const risk = r.filter((x) => x.ruleId === "ext/risk");
            const policy = new Set(r.filter((x) => x.ruleId.startsWith("policy/")).map((x) => x.locations[0].physicalLocation.region.startLine + x.locations[0].physicalLocation.artifactLocation.uri));
            const high = risk.filter((x) => x.level === "error" || policy.has(x.locations[0].physicalLocation.region.startLine + x.locations[0].physicalLocation.artifactLocation.uri)).length;
            console.log(`scanned=${risk.length}\nhigh=${high}\nmedium=${risk.filter((x) => x.level === "warning").length}`);
          ' "$sarif" >> "$GITHUB_OUTPUT"
        else
          printf 'scanned=0\nhigh=0\nmedium=0\n' >> "$GITHUB_OUTPUT"
        fi
        cat "$summary" >> "$GITHUB_STEP_SUMMARY"
        exit 0

    - name: Upload SARIF to code scanning
      if: inputs.sarif == 'true' && steps.scan.outputs.scanned != '0'
      continue-on-error: true
      uses: github/codeql-action/upload-sarif@v3
      with:
        sarif_file: ${{ steps.scan.outputs.sarif-file }}
        category: ${{ inputs.sarif-category }}

    - name: Comment on the pull request
      if: inputs.comment == 'true' && github.event.pull_request.number
      continue-on-error: true
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        REPO: ${{ github.repository }}
        PR: ${{ github.event.pull_request.number }}
        SUMMARY: ${{ steps.scan.outputs.summary-file }}
        SCANNED: ${{ steps.scan.outputs.scanned }}
        CODE: ${{ steps.scan.outputs.exit-code }}
      run: |
        set -euo pipefail
        marker='<!-- jest-security-extension-guard -->'
        existing=$(gh api "repos/$REPO/issues/$PR/comments" --paginate --jq ".[] | select(.body | startswith(\"$marker\")) | .id" | head -n1)
        if [ -n "$existing" ]; then
          gh api -X PATCH "repos/$REPO/issues/comments/$existing" -F "body=@$SUMMARY" > /dev/null
        elif [ "$SCANNED" != "0" ] || [ "$CODE" != "0" ]; then
          gh api -X POST "repos/$REPO/issues/$PR/comments" -F "body=@$SUMMARY" > /dev/null
        fi

    - name: Verdict
      shell: bash
      env:
        CODE: ${{ steps.scan.outputs.exit-code }}
        STRICT: ${{ inputs.fail-on-incomplete }}
      run: |
        case "$CODE" in
          0) echo "Extension guard: pass" ;;
          1) echo "::error::Extension guard: a new or changed extension is blocked (see the summary)"; exit 1 ;;
          2) if [ "$STRICT" = "true" ]; then echo "::error::Extension guard: some extensions could not be scanned"; exit 1; fi
             echo "::warning::Extension guard: some extensions could not be scanned" ;;
          *) echo "::error::Extension guard failed to run (exit $CODE)"; exit 1 ;;
        esac
