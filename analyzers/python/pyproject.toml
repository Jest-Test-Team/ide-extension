[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jest-ext-py"
version = "0.1.0"
description = "Python analyzer for jest-security scan-extension --deep: inspects Python files shipped inside editor extensions"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = []

[project.scripts]
jest-ext-py = "jest_ext_py.__main__:main"

[tool.setuptools]
packages = ["jest_ext_py"]
