name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: Integration tests (Linux, headless)
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:integration
      - name: Integration tests
        if: runner.os != 'Linux'
        run: npm run test:integration
      - name: Package
        if: runner.os == 'Linux'
        run: npm run package
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Linux'
        with:
          name: vsix
          path: vsix/*.vsix

  go-analyzer:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: analyzers/go
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          # go.mod states the minimum (1.22); its test binaries abort on current macOS runners
          # (missing LC_UUID), fixed in later Go releases.
          go-version: stable
          cache-dependency-path: analyzers/go/go.mod
      - name: gofmt
        if: runner.os != 'Windows'
        run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test ./...
      - uses: actions/setup-node@v4
        if: runner.os == 'Linux'
        with:
          node-version: 22
          cache: npm
      - name: CLI drives the Go analyzer
        if: runner.os == 'Linux'
        working-directory: .
        run: |
          npm ci
          npm run build -w @jest-test-team/security-cli
          node packages/cli/dist/jest-security.js analyzers install go --source analyzers/go
          node packages/cli/dist/jest-security.js scan-extension extensions/endpoint-security/test/fixtures/extensions --analyzers go --fail-on none --out - --format json > deep.json
          node -e "const d=require('./deep.json'); const go=d.coverage.analyzers.find(a=>a.engine==='go'); if(!go||go.ran<8||go.errors.length) throw new Error(JSON.stringify(d.coverage.analyzers)); console.log('go analyzer ran', go.ran, 'vectors')"

  python-analyzer:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.9', '3.13']
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: analyzers/python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -v
      - name: Installs as a package
        run: |
          python -m pip install .
          jest-ext-py info

  rust-analyzer:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: analyzers/rust
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: analyzers/rust
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      - uses: actions/setup-node@v4
        if: runner.os == 'Linux'
        with:
          node-version: 22
          cache: npm
      - name: CLI drives the Rust analyzer
        if: runner.os == 'Linux'
        working-directory: .
        run: |
          npm ci
          npm run build -w @jest-test-team/security-cli
          node packages/cli/dist/jest-security.js analyzers install rs --source analyzers/rust
          node packages/cli/dist/jest-security.js scan-extension extensions/endpoint-security/test/fixtures/extensions --analyzers rs --fail-on none --out - --format json > deep.json
          node -e "const d=require('./deep.json'); const rs=d.coverage.analyzers.find(a=>a.engine==='rs'); if(!rs||rs.ran<22||rs.errors.length) throw new Error(JSON.stringify(d.coverage.analyzers)); console.log('rust analyzer ran', rs.ran, 'vectors')"

  julia-analyzer:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1'
      - uses: julia-actions/cache@v2
      - name: Test
        working-directory: analyzers/julia
        run: julia --startup-file=no --project=. -e "using Pkg; Pkg.instantiate(); Pkg.test()"

  runtime-audit-kernel:
    # Kernel probes (bpftrace, root) for audit-extension --kernel. Not yet proven on hosted runners.
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build -w @jest-test-team/security-cli
      - run: sudo apt-get update && sudo apt-get install -y bpftrace
      - name: Audit the fixtures with kernel probes
        run: |
          sudo -E env "PATH=$PATH" node packages/cli/dist/jest-security.js audit-extension packages/cli/test/fixtures/runtime/daemon --yes --offline --allow-exec --kernel --duration 2 --format json --out kernel.json --fail-on none
          node -e "const r=require('./kernel.json'); console.log('kernel:', r.run.kernelSkipped || 'ran', 'baseline W+X', r.run.baselineRwx); if (r.run.kernelSkipped) process.exit(1); if (!r.runtime.signals.some(s=>s.id==='runtime/orphan-process-daemon')) process.exit(1)"
