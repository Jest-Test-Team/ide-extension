# Publishes all extensions when a tag like v0.1.0 is pushed.
# Required repository secrets:
#   VSCE_PAT  — Azure DevOps personal access token with the "Marketplace (Manage)" scope, organisation "All accessible organizations"
#   OVSX_PAT  — optional, Open VSX access token (https://open-vsx.org/user-settings/tokens)
#   NPM_TOKEN — optional, npm automation token; publishes the CLI package @jest-test-team/security-cli
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      OVSX_PAT: ${{ secrets.OVSX_PAT }}
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm run typecheck && npm run lint && npm test
      - run: npm run build
      - run: xvfb-run -a npm run test:integration
      - run: npm run package
      - name: Publish to the Visual Studio Marketplace
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          # The extension pack goes last so its dependencies already exist.
          for f in vsix/endpoint-security-*.vsix vsix/julia-profiler-*.vsix vsix/hw-security-*.vsix vsix/security-pack-*.vsix; do
            npx vsce publish --packagePath "$f" --skip-duplicate
          done
      - name: Publish to Open VSX
        if: env.OVSX_PAT != ''
        run: |
          for f in vsix/endpoint-security-*.vsix vsix/julia-profiler-*.vsix vsix/hw-security-*.vsix vsix/security-pack-*.vsix; do
            npx ovsx publish "$f" --skip-duplicate
          done
      - name: Publish the CLI to npm
        if: env.NPM_TOKEN != ''
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish -w @jest-test-team/security-cli --access public
      - uses: softprops/action-gh-release@v2
        with:
          files: vsix/*.vsix
