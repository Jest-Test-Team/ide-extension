      attack: [T1059]
  - id: ext/shell-exec
    category: process
    engines: [ts, rs]
    weight: 2
    severity: warning
    title: "Runs commands through a shell"
    description: "`exec` / `spawn` with `shell: true` interprets a command string, enabling injection and hiding what runs."
